<div class="news-comments-modal" id="news-comments-modal" hidden role="dialog" aria-modal="true" aria-labelledby="news-comments-title">
    <button type="button" class="news-comments-backdrop" data-comments-close aria-label="Cerrar comentarios"></button>
    <section class="news-comments-panel" tabindex="-1">
        <header class="news-comments-header">
            <div>
                <p class="news-comments-eyebrow">Comentarios de la fuente</p>
                <h2 id="news-comments-title">Comentarios</h2>
                <p class="news-comments-summary" id="news-comments-summary"></p>
            </div>
            <button type="button" class="news-comments-close" data-comments-close aria-label="Cerrar comentarios">&times;</button>
        </header>
        <div class="news-comments-body">
            <div class="news-comments-status" id="news-comments-status" role="status">Cargando comentarios…</div>
            <ol class="news-comments-list" id="news-comments-list"></ol>
        </div>
        <footer class="news-comments-footer">
            <a id="news-comments-source-link" href="#" target="_blank" rel="noopener noreferrer">Abrir noticia original</a>
        </footer>
    </section>
</div>
