{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#070715">
    <meta name="color-scheme" content="dark">
    <title>Sin conexión | {{ site_name }}</title>
    <link rel="icon" href="{% static 'favicon.ico' %}" type="image/x-icon">
    <!-- Los estilos van embebidos: esta página tiene que pintarse sin red. -->
    <style>
        /* Nunito, como el resto del sitio. Los dos ficheros están en la caché
         * del service worker (PWA_PRECACHE_STATIC), así que cargan sin red; si
         * faltaran, cae a la del sistema. */
        @font-face {
            font-family: 'Nunito Sans';
            src: url('{% static 'fonts/nunito-sans-300.woff2' %}') format('woff2');
            font-weight: normal;
            font-display: optional;
        }
        @font-face {
            font-family: 'Nunito Sans';
            src: url('{% static 'fonts/nunito-sans-600.woff2' %}') format('woff2');
            font-weight: 600 800;
            font-display: optional;
        }
        html, body {
            height: 100%;
            margin: 0;
        }
        /* Repetido a proposito: esta pagina no carga base.css (va embebida
         * para pintarse sin red), asi que no hereda la regla comun. */
        html {
            -webkit-tap-highlight-color: transparent;
        }
        body {
            background: #070715;
            color: #e6e8f0;
            font-family: 'Nunito Sans', system-ui, -apple-system, "Segoe UI", sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 24px;
            box-sizing: border-box;
        }
        img {
            width: 96px;
            height: 96px;
            opacity: .9;
        }
        h1 {
            font-size: 1.4rem;
            font-weight: 600;
            margin: 20px 0 8px;
        }
        p {
            margin: 0 0 24px;
            color: #a8adc0;
            line-height: 1.5;
        }
        /* Los mismos valores que --fab-bg y --radius-sm de tokens.css, escritos
         * a mano porque esta página no carga los tokens. */
        button {
            background: linear-gradient(165deg, #5e44ad, #34216f);
            color: #f2f5fb;
            border: 1px solid rgba(207, 220, 241, 0.27);
            border-radius: 10px;
            min-height: 44px;
            padding: 10px 28px;
            font: inherit;
            font-weight: 600;
            cursor: pointer;
        }
        button:hover {
            background: linear-gradient(165deg, #6d52c0, #3f2a82);
        }
    </style>
</head>
<body>
    <main>
        <img src="{% static 'Img/pwa-icon-192.png' %}" alt="">
        <h1>Sin conexión</h1>
        <p>No hay red ahora mismo.<br>Cuando vuelva, esta página se recarga sola.</p>
        <button type="button" onclick="location.reload()">Reintentar</button>
    </main>
    <script>
        window.addEventListener('online', function () {
            location.reload();
        });
    </script>
</body>
</html>
