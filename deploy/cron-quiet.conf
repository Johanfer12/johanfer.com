# Instalar en /etc/systemd/system/cron.service.d/quiet.conf
# Aplicar: sudo systemctl daemon-reload && sudo systemctl restart cron
#
# cron apuntaba en el journal cada ejecución del script de Cloudflare (cada
# 10 min) y del watchdog de wifi (cada 5 min), con su apertura y cierre de
# sesión PAM: ~1.800 líneas al día, casi la mitad del journal (noviembre 2026).
# journald reescribe índices y cabeceras por cada entrada, así que esas líneas
# pesaban en la SD mucho más que su texto.
#
# Con `notice` se descartan los mensajes informativos de cron y de sus tareas
# (que son esos), y se conservan avisos y errores. Las tareas del proyecto no
# van por cron sino por temporizadores de systemd, así que no les afecta.
[Service]
LogLevelMax=notice
