# Sitio de johanfer.com. Instalar en /etc/nginx/sites-available/my_bookshelf y
# enlazar en sites-enabled.
#
# DEPENDE de los tres ficheros de deploy/nginx/conf.d/, que definen a nivel http
# las variables $fail2ban_banned_ip y $block_bad_uri y la zona admin_login. Sin
# ellos nginx no arranca ("unknown variable").

server {
    listen 80;
    listen [::]:80;
    server_name johanfer.com www.johanfer.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name johanfer.com www.johanfer.com;

    # 444 = cerrar la conexión sin responder. Los escáneres no reciben ni un
    # código de estado del que aprender.
    if ($fail2ban_banned_ip) {
        return 444;
    }

    if ($block_bad_uri) {
        return 444;
    }

    ssl_certificate /home/johan/ssl/johanfer.com.pem;
    ssl_certificate_key /home/johan/ssl/johanfer.com.key;

    # Cachear descriptores/metadatos de archivos abiertos: menos open()/stat()
    # contra la SD en cada petición de estáticos.
    open_file_cache max=1000 inactive=5m;
    open_file_cache_valid 10m;
    open_file_cache_min_uses 1;
    open_file_cache_errors on;

    location /static/ {
        alias /home/johan/My_Bookshelf/staticfiles/;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Portadas de libros: el nombre no lleva hash ({id}.webp) pero solo se
    # descargan una vez; 30 días deja que Cloudflare y el navegador las
    # sirvan sin tocar la Pi.
    location /media/ {
        alias /home/johan/My_Bookshelf/media/;
        add_header Cache-Control "public, max-age=2592000";
    }

    location = /j_admin/login/ {
        limit_req zone=admin_login burst=5 nodelay;
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}
