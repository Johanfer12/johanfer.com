# Instalar en /etc/nginx/conf.d/gzip.conf
# Aplicar: sudo nginx -t && sudo systemctl reload nginx
#
# nginx.conf trae `gzip on` pero con `gzip_types` comentado, así que solo se
# comprimía el HTML. El JSON del scroll infinito y de las tandas del feed, y los
# CSS/JS cuando Cloudflare los pide al origen, salían sin comprimir de la Pi
# por el wifi. Cloudflare ya comprime hacia el visitante; esto es el tramo de
# la Pi a Cloudflare. Nivel 5: casi todo el ahorro del 9 con mucha menos CPU.
gzip_vary on;
gzip_proxied any;
gzip_comp_level 5;
gzip_min_length 1024;
gzip_types
    text/css
    text/plain
    text/xml
    application/javascript
    application/json
    application/manifest+json
    application/xml
    image/svg+xml;
