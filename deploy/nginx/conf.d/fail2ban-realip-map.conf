# /etc/nginx/conf.d/fail2ban-realip-map.conf
# Define $fail2ban_banned_ip. /etc/nginx/blacklisted-ips.map lo escribe fail2ban
# a través de la acción nginx-block-map-safe; es estado en runtime, no config.
# Debe existir aunque esté vacío o nginx no arranca.
geo $fail2ban_banned_ip {
    default 0;
    include /etc/nginx/blacklisted-ips.map;
}
