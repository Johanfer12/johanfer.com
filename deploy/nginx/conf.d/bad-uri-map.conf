# /etc/nginx/conf.d/bad-uri-map.conf
# Define $block_bad_uri. La lista real vive en /etc/nginx/bad_uri_map.conf, que
# se va ampliando a mano con las rutas que sondean los escáneres (wp-admin,
# wlwmanifest.xml y demás). Ese fichero NO está versionado: es una lista viva.
# Basta con que exista, aunque esté vacío.
map $uri $block_bad_uri {
    default 0;
    include /etc/nginx/bad_uri_map.conf;
}
