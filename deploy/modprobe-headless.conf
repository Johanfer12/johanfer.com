# Instalar en /etc/modprobe.d/headless.conf.
#
# Con gpu_mem=16 (deploy/boot/config.txt) el firmware recortado no ofrece los
# servicios de cámara, códec ni audio, pero el árbol de dispositivos sigue
# anunciándolos: estos módulos se cargaban igual y fallaban al arrancar
# ("Failed to open VCHI service connection"). Sin uso en un servidor.
blacklist bcm2835_codec
blacklist bcm2835_isp
blacklist bcm2835_v4l2
blacklist bcm2835_mmal_vchiq
blacklist vc_sm_cma
blacklist snd_bcm2835
